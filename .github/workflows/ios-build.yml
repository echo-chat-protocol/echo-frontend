name: iOS Build (Unsigned IPA for AltStore)

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust + iOS targets
        run: |
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Write .env.production
        run: |
          cat > .env.production <<'EOF'
          VITE_API_URL=https://echo-backend-preproduction.onrender.com/api/v1
          VITE_SOCKET_URL=https://echo-backend-preproduction.onrender.com
          VITE_TENOR_API_KEY=
          VITE_PUBLIC_BUILDER_KEY=
          EOF

      - name: Initialize iOS project (non-interactive)
        run: |
          # Tauri ios init may prompt for the Apple Development Team. We feed
          # an empty answer twice so it picks the no-signing path.
          printf '\n\n' | npx tauri ios init || npx tauri ios init --ci || true
          echo "---- gen/apple tree ----"
          ls -la src-tauri/gen/apple || true
          find src-tauri/gen/apple -maxdepth 3 -type d 2>/dev/null || true

      - name: CocoaPods install (if real deps exist)
        run: |
          PODFILE=src-tauri/gen/apple/Podfile
          if [ ! -f "$PODFILE" ]; then
            echo "No Podfile — skipping"
            exit 0
          fi
          # Skip when the Podfile is the empty stub Tauri generates by default.
          # That stub references an app_macOS target that doesn't exist when
          # only `tauri ios init` has run, and pod install would fail.
          if grep -E "^\s*pod\s+['\"]" "$PODFILE" > /dev/null 2>&1; then
            cd src-tauri/gen/apple
            pod install --repo-update
          else
            echo "Podfile has no real pod dependencies — skipping pod install"
            echo "---- Podfile contents ----"
            cat "$PODFILE"
          fi

      - name: Detect Xcode project + scheme
        id: detect
        run: |
          cd src-tauri/gen/apple

          # Prefer workspace if it exists, fall back to xcodeproj
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n1 || true)
          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n1 || true)

          if [ -n "$WORKSPACE" ]; then
            TARGET="-workspace $WORKSPACE"
            LIST_TARGET="-workspace $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            TARGET="-project $PROJECT"
            LIST_TARGET="-project $PROJECT"
          else
            echo "::error::No .xcworkspace or .xcodeproj generated by tauri ios init"
            ls -la
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Project:   $PROJECT"
          echo "----- xcodebuild -list -----"
          xcodebuild $LIST_TARGET -list

          # Pick the iOS scheme. Tauri names schemes like "<app>_iOS".
          SCHEME=$(xcodebuild $LIST_TARGET -list 2>/dev/null \
            | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' \
            | sed 's/^[[:space:]]*//' \
            | grep -E '_iOS$' \
            | head -n1)

          if [ -z "$SCHEME" ]; then
            # Fallback: first scheme listed
            SCHEME=$(xcodebuild $LIST_TARGET -list 2>/dev/null \
              | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' \
              | sed 's/^[[:space:]]*//' \
              | head -n1)
          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::Could not detect any scheme"
            exit 1
          fi

          echo "Detected scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT"     >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"

      - name: Build iOS archive (unsigned)
        run: |
          cd src-tauri/gen/apple

          if [ -n "${{ steps.detect.outputs.workspace }}" ]; then
            TARGET_FLAG=(-workspace "${{ steps.detect.outputs.workspace }}")
          else
            TARGET_FLAG=(-project "${{ steps.detect.outputs.project }}")
          fi

          xcodebuild archive \
            "${TARGET_FLAG[@]}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/app.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO

      - name: Package unsigned IPA
        run: |
          cd build
          echo "---- xcarchive contents ----"
          ls -la app.xcarchive/Products/Applications/ || true

          APP_DIR=$(ls -d app.xcarchive/Products/Applications/*.app | head -n1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle inside xcarchive"
            exit 1
          fi
          APP_NAME=$(basename "$APP_DIR" .app)
          echo "Found app: $APP_DIR (name: $APP_NAME)"

          mkdir -p Payload
          cp -R "$APP_DIR" "Payload/"
          IPA_NAME="${APP_NAME}-unsigned.ipa"
          zip -qr "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA_PATH=$PWD/$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-unsigned-ipa
          path: build/*.ipa
          retention-days: 14
          if-no-files-found: error
