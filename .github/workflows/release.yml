name: Release (Tauri)

# Builds the Echo installers and publishes them to a single GitHub Release:
#   - Windows 64-bit NSIS .exe
#   - Windows 32-bit NSIS .exe
#   - macOS universal .dmg (runs on Apple Silicon AND Intel)
# GitHub attaches the source-code archives automatically once published.
#
# Trigger by pushing a version tag:
#     git tag v0.1.1
#     git push origin v0.1.1
# ...or run it manually from the Actions tab (workflow_dispatch).
#
# Flow:
#   1. create-release  — make ONE draft release, output its id
#   2. build-tauri      — build each installer, upload to that id
#   3. publish-release  — flip draft -> published (adds Source code assets)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        run: echo "PACKAGE_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - name: Create (or reuse) the release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.PACKAGE_VERSION
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : `v${version}`
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              core.info(`Reusing existing release ${existing.data.id} for ${tag}`)
              return existing.data.id
            } catch (e) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Echo v${version}`,
                body: 'Windows installers (64-bit and 32-bit) and a macOS universal .dmg are attached below.',
                draft: true,
                prerelease: false,
              })
              core.info(`Created draft release ${data.id} for ${tag}`)
              return data.id
            }

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'windows-x64'
            platform: 'windows-latest'
            rust-targets: ''
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - label: 'windows-x86'
            platform: 'windows-latest'
            rust-targets: 'i686-pc-windows-msvc'
            args: '--target i686-pc-windows-msvc --bundles nsis'
          - label: 'macos-universal'
            platform: 'macos-latest'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        # `npm install` (not `npm ci`) tolerates a slightly out-of-sync lockfile.
        # HUSKY=0 skips the `prepare: husky` git-hook setup, unneeded in CI.
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Build ${{ matrix.label }} and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [create-release, build-tauri]
    # Run even if one leg failed (e.g. 32-bit), as long as the release exists —
    # publish whatever installers DID upload.
    if: ${{ always() && needs.create-release.result == 'success' }}
    steps:
      - name: Publish the release (only if installers were uploaded)
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID)
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            })
            if (assets.data.length === 0) {
              core.setFailed('No installers uploaded — leaving the release as a draft.')
              return
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false,
            })
            core.info(`Published release ${release_id} with ${assets.data.length} asset(s).`)
