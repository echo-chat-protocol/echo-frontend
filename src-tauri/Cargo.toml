[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"
# Vendored + patched to render image attachments as an Android BigPictureStyle
# (upstream 2.3.3 parses `attachments` but never draws them on Android).
tauri-plugin-notification = { path = "plugins/tauri-plugin-notification" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
